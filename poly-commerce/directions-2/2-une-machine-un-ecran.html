<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="_base.css"><style>
body{background:#fff}
.seg{display:flex;gap:0;margin:12px 16px;border:1px solid var(--encre);border-radius:4px;overflow:hidden}
.seg b{flex:1;text-align:center;font:700 13px var(--x);padding:9px 0;border-left:1px solid var(--encre)}.seg b:first-child{border:0}.seg b.on{background:var(--encre);color:#fff}
.scene{position:relative;margin:0 16px;border-radius:6px;overflow:hidden}
.scene img{width:100%;aspect-ratio:4/3;object-fit:cover}
.scene .num{position:absolute;top:10px;left:10px;font:700 12px var(--m);background:#fff;padding:5px 9px;border-radius:3px}
.scene .fl{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:#fffffff0;display:grid;place-items:center;font:700 18px var(--x);box-shadow:0 4px 12px #0003}
.scene .g{left:8px}.scene .d{right:8px}
.dots{display:flex;gap:4px;justify-content:center;margin:10px 0 0}.dots i{width:16px;height:3px;background:var(--ligne)}.dots i.on{background:var(--encre);width:28px}
.info{padding:14px 16px 0}
.info small{font:600 11px var(--m);color:var(--olive-f);letter-spacing:.12em;text-transform:uppercase}
.info h1{font-size:28px;margin:6px 0 10px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--encre);border-bottom:1px solid var(--ligne)}
.specs div{padding:10px 8px 10px 0}.specs div+div{padding-left:10px;border-left:1px solid var(--ligne)}
.specs em{display:block;font:600 10px var(--m);font-style:normal;color:var(--doux);letter-spacing:.1em;text-transform:uppercase}
.specs b{white-space:nowrap;font:800 16px var(--x);font-stretch:125%}
.lg{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 16px 0}
.btns a{min-height:48px;display:grid;place-items:center;font:700 14px var(--x);border:2px solid var(--encre);border-radius:4px}.btns a.p{background:var(--encre);color:#fff}
.suite{display:flex;gap:6px;margin:16px 0 0 16px;overflow:hidden}.suite img{width:84px;aspect-ratio:4/3;object-fit:cover;border-radius:4px;opacity:.85}
.suite span{font:600 11px var(--m);color:var(--doux);align-self:center;margin-left:4px;white-space:nowrap}
</style></head><body>
<div class="barre"><img src="../photos/logo.png" alt=""><span class="tel">✆ 06 87 85 84 36</span></div>
<div class="seg"><b class="on">Forêt</b><b>TP</b><b>Agricole</b></div>
<div class="scene"><img src="../photos/46819975_1774949277_746.jpg" alt=""><span class="num">1 / 6 · glissez</span><span class="fl g">‹</span><span class="fl d">›</span></div>
<div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="info"><small>Débusqueur avec grue Charlier</small><h1>John Deere 648 H</h1>
<div class="specs"><div><em>Année</em><b>2011</b></div><div><em>Heures</em><b>8 850</b></div><div><em>Prix HT</em><b>178 800 €</b></div></div>
<div class="lg"><span class="franc o">Heures d'origine</span><span class="horametre"><span>0</span><span>8</span><span>8</span><span>5</span><span>0</span><small>h</small></span></div></div>
<div class="btns"><a class="p">Appeler</a><a>Toutes les photos</a></div>

</body></html>
