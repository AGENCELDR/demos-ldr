<style>
:root{--fond:#0A1A33;--fond2:#0F2447;--blanc:#F4F6FA;--rouge:#F0483E;--doux:#9FB0CC}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--blanc);font:16px/1.5 Archivo,sans-serif;overflow-x:hidden}

.trajet{fill:none;stroke:var(--rouge);stroke-width:1.6;stroke-dasharray:4 5;animation:d 2s linear infinite}

h1 em{font-style:normal;color:var(--rouge)}
p{margin:0 0 18px;color:#d4dcea}
.b{display:flex;gap:10px}.b a{flex:1;text-align:center;padding:14px;border-radius:6px;font-weight:600;text-decoration:none}
.p{background:var(--rouge);color:#fff}.s{border:1px solid #9fb0cc88;color:var(--blanc)}
.ch{display:flex;gap:16px;margin-top:16px;font:500 12px "DM Mono";color:var(--doux)}.ch b{display:block;font:400 26px/1 "Archivo Black";color:var(--blanc)}
