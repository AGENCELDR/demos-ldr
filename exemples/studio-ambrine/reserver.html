<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
.mag{max-width:640px;margin:0 auto;padding:18px 16px 140px}

.q{font-size:clamp(28px,7.4vw,38px)}.aide{color:var(--doux2);margin:8px 0 18px}
.groupe{margin:22px 0 10px;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--doux)}
.jours{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.jours .ch{flex:0 0 76px;min-height:84px;scroll-snap-align:start}.jours .ch b{font-size:26px}.jours .ch i{font-style:normal;font-size:12px;color:var(--doux)}

.heures{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.heures .ch{min-height:56px}.heures .ch b{font:700 17px Figtree,sans-serif}.heures .ch small{color:#A9C79A;font-weight:600;font-size:11.5px}
.creux{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#2B3324;border:1px solid #4E5E41;color:#DCEBD0;font-size:14.5px;margin-top:14px}
.vide{padding:18px;border-radius:14px;background:var(--carte);color:var(--doux2);text-align:center}
.bas{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(30,19,16,.96);backdrop-filter:blur(10px);border-top:1px solid var(--trait);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bas .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}.bas .go{flex:1}.bas .retour{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--trait2);background:none;font-size:20px;flex:none}
.bas .info{font-size:13px;color:var(--doux);text-align:center;margin:0 0 8px}
.plan{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--trait)}.plan img{width:100%}
.pt{position:absolute;transform:translate(-50%,-50%);width:13%;aspect-ratio:1;border-radius:50%;border:2.5px solid #fff;background:rgba(243,185,178,.28);box-shadow:0 0 0 3px rgba(0,0,0,.25);padding:0;display:grid;place-items:center;font:800 15px Figtree;color:#fff;text-shadow:0 1px 3px #000}
.pt.petit{width:10%}.pt[aria-pressed=true]{background:#7A2A36;border-color:var(--rose);box-shadow:0 0 0 4px var(--rose),inset 0 3px 8px rgba(0,0,0,.6)}
.pt:disabled{background:rgba(60,50,48,.7);border-color:#9b8e89;color:#ddd;cursor:default}.pt:disabled::after{content:"Prise";position:absolute;top:100%;font-size:11px;margin-top:2px}
.legende{display:flex;gap:16px;font-size:13px;color:var(--doux);margin:10px 0}.legende i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid #fff;background:rgba(243,185,178,.3)}.legende .p i{background:#3C3230;border-color:#9b8e89}
.choisi{padding:12px 14px;border-radius:14px;background:var(--carte);margin-top:10px;min-height:50px}
.ligne{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--trait)}.ligne span{flex:1}.ligne small{display:block;color:var(--doux);font-size:13px}.ligne b{font-weight:600}
.photo-c{display:flex;gap:12px;align-items:center;margin-top:8px}.photo-c img{width:72px;height:72px;border-radius:12px;object-fit:cover}
.cpt{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--trait)}.cpt div{display:flex;align-items:center;gap:12px}.cpt button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--trait2);background:var(--carte);font-size:20px}.cpt output{min-width:20px;text-align:center;font-weight:700;font-size:18px}
.recap{background:var(--carte);border-radius:18px;padding:4px 16px;border:1px solid var(--trait)}
.dure{display:inline-block;margin-top:10px;font-size:14px;color:var(--doux2)}
@media(min-width:900px){.heures{grid-template-columns:repeat(5,1fr)}}
</style></head>
