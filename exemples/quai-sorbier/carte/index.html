<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carte du Quai Sorbier · exemple Agence LDR</title>
<meta name="robots" content="noindex">
<style id="ldr-public">html:not(.voir-patron) #pat{display:none!important}</style>
<script>if(/[?&]patron=1/.test(location.search))document.documentElement.classList.add('voir-patron');</script>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style id="st">
/* Carte au QR du Quai Sorbier : une colonne téléphone, photo du quai en ouverture, plat du soir en vedette, rubriques qui alternent nuit / papier, fiche plat en tiroir ; côté patron = petite appli sombre. */
:root{
  --bg:#0F1A1F;--s1:#16252C;--s2:#1F333B;--ink:#F1E9DA;--ink2:#B3B9B2;--brass:#D9A25B;--brass2:#8E6630;--onbrass:#1A140C;--wine:#8C3A42;--line:#2C434C;
  --alt:#F6F0E4;--altInk:#2A2420;--altMuted:#7A6B62;--altLine:#E2D6C4;--altAccent:#8C3A42;
  --ft:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fs:"Newsreader",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ok:#6FCF97;
  color-scheme:dark;
}
body[data-theme="nappe"]{--bg:#F6F0E4;--s1:#EFE6D6;--s2:#E7DCCA;--ink:#2A2420;--ink2:#6F635B;--brass:#8C3A42;--brass2:#6B2A31;--onbrass:#FFF8EE;--wine:#8C3A42;--line:#DCCFBB;--alt:#FFFFFF;--altInk:#2A2420;--altMuted:#7A6B62;--altLine:#E8DFD0;--altAccent:#8C3A42;--ok:#2F8F5B;color-scheme:light}
body[data-theme="bordeaux"]{--bg:#2A0E13;--s1:#37141B;--s2:#461C24;--ink:#F6E9DF;--ink2:#CDB3AC;--brass:#D9A25B;--brass2:#8E6630;--onbrass:#1F0A0E;--wine:#C4626C;--line:#55262E;--alt:#F6F0E4;--altInk:#2A2420;--altMuted:#7A6B62;--altLine:#E2D6C4;--altAccent:#7A1E2C}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ft);-webkit-font-smoothing:antialiased;transition:background-color .4s var(--ease),color .4s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.g{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:620px;margin:0 auto}
.it{font-family:var(--fs);font-style:italic}
.eb{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.eb-l{display:flex;align-items:center;gap:12px}
.eb-l::after{content:"";width:34px;height:1px;background:currentColor;opacity:.7}
/* Bandeau exemple + marque */
.ex{font-size:12px;text-align:center;padding-block:7px;color:var(--ink2);background:var(--s1)}
.ex b{color:var(--brass);font-weight:600}
.marque{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.marque .nm{display:flex;align-items:center;gap:10px}
.marque .pt{width:9px;height:9px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 4px color-mix(in srgb,var(--brass) 18%,transparent)}
.marque strong{display:block;font-size:17px;font-weight:700;line-height:1.1}
.marque .it{font-size:14px;color:var(--ink2)}
.maj{font-size:12px;color:var(--ink2);text-align:right;line-height:1.3}
/* Ouverture */
.hero{position:relative;margin:0;overflow:hidden}
.hero img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;max-width:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,color-mix(in srgb,var(--bg) 70%,transparent) 72%,var(--bg) 100%)}
.hero-t{position:relative;margin-top:-92px;z-index:1}
.hero-t h1{font-size:clamp(34px,10.5vw,46px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance}
.hero-t p{font-family:var(--fs);font-size:17.5px;color:var(--ink2);margin:0}
.etat{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line)}
.etat i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pouls 2.8s ease-out infinite}
@keyframes pouls{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
/* Choix à toucher (règle 2.11 : contour fin, effet enfoncé) */
.ch{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14.5px;color:var(--ink);transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s;white-space:nowrap}
.ch[aria-pressed="true"],.ch.on{background:color-mix(in srgb,var(--bg) 55%,#000 45%);border-color:var(--brass);color:var(--brass);box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
body[data-theme="nappe"] .ch[aria-pressed="true"],body[data-theme="nappe"] .ch.on{background:#E9DECC;box-shadow:inset 0 2px 5px rgba(60,40,20,.22)}
.filtres{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:22px;align-items:center}
.filtres span{font-size:13px;color:var(--ink2);margin-right:2px}

/* Bandeau « mis en avant » (Nouveauté / Prix du moment) */
.avant{margin-top:24px}
.av-rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px))}
.av-rail::-webkit-scrollbar{display:none}
.av{flex:0 0 86%;scroll-snap-align:start;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:stretch;text-align:left;border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--brass) 14%,var(--s1)) 0%,var(--s1) 60%);border-radius:18px;padding:12px;position:relative;overflow:hidden}
.av:only-child{flex-basis:100%}
.av.sans{grid-template-columns:1fr;padding:16px 18px}
.av.sans h3{font-size:22px}
.av img,.av .noph{width:96px;height:100%;min-height:112px;object-fit:cover;border-radius:12px;display:block}
.av .noph{display:grid;place-items:center;background:color-mix(in srgb,var(--brass) 18%,var(--bg));font-family:var(--fs);font-style:italic;font-size:30px;color:var(--brass)}
.av .tg{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--onbrass);background:var(--brass);padding:4px 9px;border-radius:999px}
.av.nv .tg{background:transparent;color:var(--brass);border:1px solid var(--brass)}
.av h3{font-size:18px;font-weight:700;line-height:1.2;margin:8px 0 2px}
.av .ds{font-family:var(--fs);font-style:italic;color:var(--ink2);font-size:15px;line-height:1.3;margin:0}
.av .pr{display:flex;align-items:baseline;gap:9px;margin-top:8px;font-variant-numeric:tabular-nums}
.av .pr b{font-size:20px;color:var(--brass)}
.av .pr s{color:var(--ink2);font-size:14.5px;text-decoration-thickness:1.5px}
.av .rs{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.av .jauge{height:4px;border-radius:9px;background:color-mix(in srgb,var(--ink) 14%,transparent);margin-top:5px;overflow:hidden}
.av .jauge i{display:block;height:100%;background:var(--brass);border-radius:9px}
.av-pts{display:flex;justify-content:center;gap:6px;margin-top:10px}
.av-pts i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.av-pts i.on{background:var(--brass);width:18px;border-radius:9px}
/* Vedette */
.vedette{margin-top:30px}
.v-carte{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:20px;overflow:hidden;padding:0;margin-top:12px}
.v-carte .ph{position:relative}
.v-carte img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
.v-carte .lb{white-space:nowrap;position:absolute;left:14px;top:14px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--brass);color:var(--onbrass);padding:6px 10px;border-radius:999px}
.v-carte .tx{padding:16px 18px 18px}
.v-carte .l1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.v-carte h3{margin:0;font-size:22px;font-weight:700;line-height:1.15}
.v-carte .px{font-size:20px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums;white-space:nowrap}
.v-carte p{margin:6px 0 0;font-family:var(--fs);font-style:italic;color:var(--ink2);font-size:16.5px}
.v-carte .vo{display:inline-flex;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--brass);gap:6px;align-items:center}
/* Onglets collants */
nav.rub{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:30px}
nav.rub .g{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.rub .g::-webkit-scrollbar{display:none}
nav.rub .ch{min-height:38px;padding:7px 15px;font-size:14px}
/* Rubriques */
.sec{padding-block:38px 30px;scroll-margin-top:58px}
.sec.alt{background:var(--alt);color:var(--altInk)}
.sec.alt .eb{color:var(--altAccent)}
.sec h2{font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.015em;margin:10px 0 4px}
.sec .sous{font-family:var(--fs);font-style:italic;color:var(--ink2);margin:0 0 18px;font-size:16.5px}
.sec.alt .sous{color:var(--altMuted)}
.une{display:block;width:100%;padding:0;border:0;background:none;text-align:left;margin:4px 0 8px;border-radius:16px;overflow:hidden;position:relative}
.une img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%;border-radius:16px}
.une figcaption{position:absolute;left:12px;bottom:12px;font-family:var(--fs);font-style:italic;font-size:15px;color:#F6F0E4;background:rgba(15,26,31,.62);padding:5px 11px;border-radius:8px;backdrop-filter:blur(4px)}
.pl{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;padding:15px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.sec.alt .pl{border-bottom-color:var(--altLine)}
.pl:last-child{border-bottom:0}
.pl .th{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none}
.pl .co{flex:1;min-width:0}
.pl .l1{display:flex;align-items:baseline;gap:8px}
.pl .nm{font-weight:600;font-size:17px;line-height:1.25}
.pl .ld{flex:1;min-width:16px;border-bottom:1.5px dotted currentColor;opacity:.28;transform:translateY(-4px)}
.pl .px{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16.5px}
.pl .px small{font-weight:500;font-size:12.5px;opacity:.7}
.pl .ds{font-family:var(--fs);font-style:italic;color:var(--ink2);font-size:15.5px;margin-top:2px;line-height:1.35}
.sec.alt .pl .ds{color:var(--altMuted)}
.pas{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px}
.pa{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:999px;border:1px solid currentColor;font-size:10.5px;font-weight:700;letter-spacing:.03em;opacity:.75}
.pl.ep .nm,.pl.ep .ds,.pl.ep .th{opacity:.42}
.pl.ep .px{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--wine)}
.sec.alt .pl.ep .px{color:var(--altAccent)}
.cols{display:flex;justify-content:flex-end;gap:18px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding-bottom:4px;border-bottom:1px solid var(--line)}
.sec.alt .cols{color:var(--altMuted);border-bottom-color:var(--altLine)}
.cols span,.px2 span{width:64px;text-align:right}
.px2{display:flex;gap:18px}
.vide{font-family:var(--fs);font-style:italic;color:var(--ink2);padding:14px 0}
.cave-ph{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;margin-bottom:12px}
.cave-ph img{width:120px;aspect-ratio:4/5;object-fit:cover;border-radius:12px;border:1px solid var(--brass2);padding:4px;background:var(--s1)}
.cave-ph p{font-family:var(--fs);font-size:16px;color:var(--ink2);margin:0}
/* Pied */
.pied{padding-block:34px calc(110px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.pied .al{border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-family:var(--fs);font-style:italic;font-size:16px;color:var(--ink2);text-align:center}
.pied .mt{font-size:12.5px;color:var(--ink2);text-align:center;margin:16px 0 0;line-height:1.6}
.ldr{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto 0;padding:9px 16px;border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%;font-size:11.5px;color:var(--ink2)}
.ldr b{display:block;font-size:12.5px;letter-spacing:.12em;color:var(--ink)}
.ldr svg{width:22px;height:22px;flex:none}
.pat-btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;border:1px solid var(--brass);background:#0F1A1F;color:#F1E9DA;font-size:14.5px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.pat-btn svg{width:16px;height:16px;color:#D9A25B}
/* Fiche plat (tiroir) */
.voile{position:fixed;inset:0;z-index:40;background:rgba(5,10,12,.55);opacity:0;transition:opacity .28s var(--ease)}
.voile.on{opacity:1}
.tiroir{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;overflow-y:auto;background:var(--bg);color:var(--ink);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .34s var(--ease);padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.tiroir.on{transform:none}
.tiroir.edit{--bg:#0F1A1F;--s1:#16252C;--s2:#1F333B;--ink:#F1E9DA;--ink2:#B3B9B2;--brass:#D9A25B;--onbrass:#1A140C;--wine:#C4626C;--line:#2C434C;color-scheme:dark}
.tiroir.edit .ch[aria-pressed="true"]{background:#0A1216;box-shadow:inset 0 2px 6px rgba(0,0,0,.5);border-color:var(--brass);color:var(--brass)}
.tiroir .poi{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto}
.tiroir .ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
.tiroir .ct{padding:18px 22px 6px}
.tiroir h3{font-size:26px;line-height:1.1;font-weight:800;margin:6px 0 6px;letter-spacing:-.01em}
.tiroir .px{font-size:22px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums}
.tiroir .ds{font-family:var(--fs);font-style:italic;font-size:18px;color:var(--ink2);margin:6px 0 0}
.info{margin-top:18px;border-top:1px solid var(--line)}
.info div{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.info dt,.info .k{color:var(--ink2);flex:none}
.info .v{text-align:right;font-weight:600;min-width:0}
.tiroir .fer{display:block;margin:18px 22px 0;width:calc(100% - 44px);min-height:50px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;font-size:15.5px}
.x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(15,26,31,.7);color:#F1E9DA;display:grid;place-items:center;z-index:2}
.x svg{width:18px;height:18px}

/* ===== Côté patron : petite appli, toujours dans les tons du soir ===== */
.pat{--bg:#0F1A1F;--s1:#16252C;--s2:#1F333B;--ink:#F1E9DA;--ink2:#B3B9B2;--brass:#D9A25B;--onbrass:#1A140C;--wine:#C4626C;--line:#2C434C;--ok:#6FCF97;position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--ink);overflow-y:auto;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));color-scheme:dark}
.pat .ch[aria-pressed="true"],.pat .ch.on{background:#0A1216;box-shadow:inset 0 2px 6px rgba(0,0,0,.5);border-color:var(--brass);color:var(--brass)}
.ph-top{position:sticky;top:0;z-index:3;background:color-mix(in srgb,#0F1A1F 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.ph-top .g{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.ph-top strong{font-size:17px;font-weight:700}
.ph-top .it{display:block;font-size:13.5px;color:var(--ink2);font-weight:400}
.lien{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
/* Clavier code */
.code{min-height:100%;display:flex;flex-direction:column;align-items:center;padding-top:calc(48px + env(safe-area-inset-top,0px));text-align:center}
.code .pt{width:11px;height:11px;border-radius:50%;background:var(--brass);margin:0 auto 18px;box-shadow:0 0 0 5px rgba(217,162,91,.18)}
.code h2{font-size:26px;font-weight:800;margin:0}
.code p{font-family:var(--fs);font-style:italic;color:var(--ink2);margin:6px 0 0;font-size:16.5px}
.pts{display:flex;gap:16px;justify-content:center;margin:28px 0 30px}
.pts i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink2);transition:background .15s,border-color .15s}
.pts i.on{background:var(--brass);border-color:var(--brass)}
.pts.err{animation:non .38s}
@keyframes non{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.kp{display:grid;grid-template-columns:repeat(3,78px);gap:14px 22px;justify-content:center}
.kp button{width:78px;height:78px;border-radius:50%;border:1px solid var(--line);background:var(--s1);font-size:27px;font-weight:500;display:grid;place-items:center;transition:background .12s,transform .12s}
.kp button:active{background:var(--s2);transform:scale(.96)}
.kp button.nu{border:0;background:none}
.kp svg{width:26px;height:26px}
.indice{margin-top:26px;font-size:13.5px;color:var(--ink2)}
.indice b{color:var(--brass)}
/* Accueil patron */
.hello{padding-block:24px 6px}
.hello h2{font-size:30px;line-height:1.08;font-weight:800;margin:6px 0 6px;letter-spacing:-.015em}
.hello p{font-family:var(--fs);font-style:italic;color:var(--ink2);margin:0;font-size:16.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--s1)}
.stat b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:13px;color:var(--ink2)}
.stat.w b{color:var(--wine)}
.pbloc{padding-block:26px 8px}

.grp{border:1px solid var(--line);border-radius:18px;background:var(--s1);overflow:hidden;margin-bottom:12px}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.grp-h b{font-size:15.5px}

.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ed{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px 0;text-align:left}
.row .mini{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:none;background:var(--s2);display:grid;place-items:center;font-weight:700;color:var(--ink2);font-size:15px}
.row .tt{min-width:0}
.row .tt b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt span{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row.ep .tt b{color:var(--ink2);text-decoration:line-through;text-decoration-color:rgba(196,98,108,.7)}
.sw{position:relative;flex:none;width:52px;height:31px;border-radius:999px;border:1px solid var(--line);background:#0A1216;transition:background .2s,border-color .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#56656b;transition:transform .22s var(--ease),background .2s}
.sw[aria-checked="true"]{background:rgba(111,207,151,.18);border-color:rgba(111,207,151,.55)}
.sw[aria-checked="true"]::after{transform:translateX(21px);background:var(--ok)}
.swl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);width:58px;text-align:right;flex:none}
.swl.e{color:var(--wine)}
.wrapc{display:flex;flex-wrap:wrap;gap:8px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.th-b{border:1px solid var(--line);border-radius:16px;background:var(--s1);padding:10px 10px 12px;text-align:center;font-size:13.5px;font-weight:600;transition:border-color .2s,box-shadow .2s}
.th-b[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 0 2px 8px rgba(0,0,0,.5);color:var(--brass)}
.mock{border-radius:12px;overflow:hidden;aspect-ratio:9/15;margin-bottom:9px;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.08)}
.mock .mh{height:38%;background-size:cover;background-position:center;position:relative}
.mock .mh::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--mb) 100%)}
.mock .mb{flex:1;background:var(--mb);padding:8px 7px;display:flex;flex-direction:column;gap:5px}
.mock .mb i{display:block;height:5px;border-radius:3px;background:var(--mi);opacity:.85}
.mock .mb i.s{width:55%;background:var(--ma)}
.mock .mb i.p{margin-top:auto;height:24px;border-radius:5px;background:var(--mp)}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;background:#0A1216;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink);transition:border-color .2s}
.inp:focus{border-color:var(--brass);outline:0}
textarea.inp{min-height:76px;resize:vertical;font-family:var(--fs);font-style:italic;font-size:17px}
.prixl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eur{position:relative}
.eur .inp{padding-right:34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.eur::after{content:"€";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink2);font-weight:600}
.ajout{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:50px;border:1px dashed var(--line);border-radius:14px;background:none;font-weight:700;color:var(--brass)}

.chev{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.tent{width:150px;padding:14px 12px 16px;background:#F6F0E4;color:#2A2420;border-radius:6px 6px 3px 3px;text-align:center;box-shadow:0 18px 30px -12px rgba(0,0,0,.7),inset 0 -6px 0 rgba(0,0,0,.06);transform:perspective(500px) rotateX(8deg);position:relative}

.tent small{display:block;font-size:8.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8C3A42}
.tent strong{display:block;font-size:13px;font-weight:800;margin:2px 0 8px}
.tent .q{background:#fff;padding:6px;border-radius:6px;width:104px;height:104px;margin:0 auto}
.tent .q svg{display:block;width:100%;height:100%}
.tent em{display:block;font-family:"Newsreader",Georgia,serif;font-size:11px;margin-top:7px;color:#5f524a}
.chev p{margin:0;font-family:var(--fs);font-size:16.5px;color:var(--ink2)}
/* Barre du bas patron */
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,#0F1A1F 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

.bt2{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;font-size:15.5px;color:#F1E9DA}
.bt1{flex:1.4;min-height:52px;border-radius:14px;border:0;background:linear-gradient(180deg,#E4B06B,#D9A25B);color:#1A140C;font-weight:800;font-size:15.5px;box-shadow:0 6px 0 #8E6630,0 12px 22px rgba(0,0,0,.3);transition:transform .1s,box-shadow .1s}
