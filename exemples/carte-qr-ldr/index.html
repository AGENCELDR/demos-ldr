<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Quai Sorbier · la carte · exemple Agence LDR</title>
<meta name="robots" content="noindex">
<meta name="description" content="Exemple de carte QR (données fictives) créée par Agence LDR : la carte d'un restaurant dans le téléphone de ses clients, modifiable par le patron en un geste.">
<meta name="theme-color" content="#070A12">
<link rel="icon" href="img/aigle-site-web.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#070A12;--nuit2:#0C111D;--panneau:rgba(9,12,21,.88);--panneau2:rgba(16,21,34,.92);
  --ligne:rgba(246,222,142,.16);--ligne2:rgba(255,255,255,.09);
  --or1:#FFF8DC;--or2:#F6DE8E;--or3:#D4A93A;--or4:#9A6E14;
  --or:linear-gradient(180deg,#FFF8DC 0%,#F6DE8E 28%,#D4A93A 58%,#9A6E14 82%,#E2BE5A 100%);
  --orange:#F59E0B;--blanc:#fff;--texte:#E9ECF2;--doux:#A9B1C2;--vert:#7BD88F;--rouge:#F08A7E;
  --r:18px;--ombre:0 18px 50px rgba(0,0,0,.45);
  --ff:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--fc:"Cinzel",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font:400 15px/1.5 var(--ff);color:var(--texte);background:var(--nuit) url(img/salle-terrasse.webp) center/cover fixed;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(7,10,18,.55) 0%,rgba(7,10,18,.82) 45%,rgba(7,10,18,.9) 100%);z-index:-1;pointer-events:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--texte)}
.page{max-width:560px;margin:0 auto;position:relative}
.or{background:var(--or);-webkit-background-clip:text;background-clip:text;color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Bandeau exemple */
.demo{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(7,10,18,.92);border-bottom:1px solid var(--ligne);font-size:12px;color:var(--doux)}
.demo img{width:30px;height:auto;flex:none}
.demo b{color:var(--or2);font-weight:700}
.demo .esp{flex:1}
.demo button{font-size:12px;font-weight:700;color:var(--or2);border:1px solid var(--ligne);border-radius:99px;padding:5px 11px}

/* Haut */
.hero{position:relative;min-height:430px;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 20px 22px;overflow:hidden}
.hero>img.fond{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,10,18,.15) 0%,rgba(7,10,18,.35) 40%,rgba(7,10,18,.95) 100%)}
.lieu{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--or2)}
.hero h1{font:700 44px/1.02 var(--fc);letter-spacing:.02em;margin:8px 0 10px;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.hero h1 span{display:block}
.hero h1 .petit{font-size:16px;letter-spacing:.34em;font-weight:600;margin-bottom:2px}
.hero .aigle{position:absolute;top:16px;right:14px;width:92px;height:auto;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55))}
.hero p.acc{font-size:16px;color:#F2F4F8;max-width:30ch}
.etat{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 13px;border-radius:99px;background:rgba(7,10,18,.72);border:1px solid var(--ligne2);font-size:13px;font-weight:600}
.etat i{width:8px;height:8px;border-radius:50%;background:var(--doux)}
.etat.ouvert i{background:var(--vert);box-shadow:0 0 0 4px rgba(123,216,143,.18)}
.hero .btns{display:flex;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px}
.btn-or{background:var(--or);color:#1A1204;box-shadow:0 8px 24px rgba(212,169,58,.28)}
.btn-ligne{border:1px solid rgba(246,222,142,.45);color:var(--or1);background:rgba(7,10,18,.5)}

/* Prix du moment */
.bloc{padding:22px 16px 6px}
.titre-bloc{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 4px 12px}
.titre-bloc h2{font:600 21px/1.2 var(--fc);letter-spacing:.04em}
.titre-bloc small{font-size:12px;color:var(--doux)}
.defile{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 4px 6px;margin:0 -4px}
.defile::-webkit-scrollbar{display:none}
.moment{flex:0 0 88%;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:var(--panneau2);border:1px solid var(--ligne);box-shadow:var(--ombre);text-align:left;position:relative}
.moment .ph{position:relative;aspect-ratio:16/9;overflow:hidden}
.moment .ph img{width:100%;height:100%;object-fit:cover}
.moment .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(9,12,21,.9))}
.pastille{position:absolute;top:12px;left:12px;z-index:2;font-size:12px;font-weight:800;letter-spacing:.04em;padding:6px 11px;border-radius:99px;background:var(--or);color:#1A1204}
.pastille.info{background:rgba(7,10,18,.85);color:var(--or2);border:1px solid var(--ligne)}
.moment .co{padding:14px 16px 16px}
.moment h3{font:600 19px/1.25 var(--fc)}
.moment p{font-size:14px;color:var(--doux);margin-top:4px}
.prixm{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.prixm s{color:var(--doux);font-size:15px}
.prixm b{font-size:24px;font-weight:800;color:var(--or2)}
.jauge{margin-top:12px}
.jauge .barre{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.jauge .barre i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F59E0B,#F6DE8E)}
.jauge .txt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--doux);margin-top:6px}
.jauge .txt b{color:var(--texte)}
.points{display:flex;justify-content:center;gap:7px;margin-top:10px}
.points i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:.25s}
.points i.on{background:var(--or2);width:20px;border-radius:99px}

/* Onglets */
.onglets{position:sticky;top:0;z-index:30;background:#070A12;border-bottom:1px solid var(--ligne);padding:10px 0 0}
.ong{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 14px 10px}
.ong::-webkit-scrollbar{display:none}
.ong button{flex:none;padding:9px 15px;border-radius:99px;font-size:14px;font-weight:600;color:var(--doux);border:1px solid var(--ligne2);white-space:nowrap}
.ong button.on{color:#1A1204;background:var(--or);border-color:transparent}
.outils{display:flex;gap:8px;padding:0 14px 10px;align-items:center}
.cherche{flex:1;position:relative}
.cherche input{width:100%;height:40px;border-radius:12px;border:1px solid var(--ligne2);background:rgba(255,255,255,.05);padding:0 36px 0 38px;font-size:14px}
.cherche input::placeholder{color:#7F889B}
.cherche svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--doux)}
.cherche .x{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:8px;display:none;color:var(--doux);font-size:18px}
.cherche.plein .x{display:block}
.bfiltre{height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--ligne2);display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
.bfiltre .n{min-width:20px;height:20px;border-radius:99px;background:var(--or);color:#1A1204;font-size:12px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px}
.bfiltre.actif{border-color:rgba(246,222,142,.5);color:var(--or1)}
.bfiltre.actif .n{display:inline-flex}
.filtres{display:none;padding:0 14px 12px}
.filtres.ouvert{display:block}
.filtres p{font-size:12px;color:var(--doux);margin:2px 0 7px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.puces{display:flex;flex-wrap:wrap;gap:7px}
.puces button{padding:7px 12px;border-radius:99px;border:1px solid var(--ligne2);font-size:13px;font-weight:600;color:var(--texte)}
.puces button.on{border-color:var(--or2);background:rgba(246,222,142,.13);color:var(--or1)}
.resultat{display:none;margin:12px 16px 0;padding:10px 14px;border-radius:12px;background:var(--panneau);border:1px solid var(--ligne);font-size:13.5px;align-items:center;justify-content:space-between;gap:10px}
.resultat.vu{display:flex}
.resultat button{color:var(--or2);font-weight:700;font-size:13.5px;white-space:nowrap}

/* Catégories */
.cat{padding:22px 12px 4px;scroll-margin-top:118px}
.bandeau{position:relative;height:118px;border-radius:var(--r);overflow:hidden;display:flex;align-items:flex-end;padding:14px 16px;margin-bottom:10px}
.bandeau img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bandeau::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,10,18,.88) 0%,rgba(7,10,18,.45) 60%,rgba(7,10,18,.15) 100%)}
.bandeau div{position:relative;z-index:1}
.bandeau h2{font:600 26px/1.1 var(--fc);letter-spacing:.05em}
.bandeau p{font-size:13px;color:#DCE1EA;margin-top:4px;max-width:34ch}
.cols{display:flex;justify-content:flex-end;gap:6px;padding:4px 16px 2px;font-size:11.5px;font-weight:700;color:var(--or2);letter-spacing:.06em;text-transform:uppercase}
.cols span{width:58px;text-align:right}
.plat{display:flex;gap:13px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--panneau);border:1px solid var(--ligne2);margin-bottom:8px;position:relative;transition:border-color .2s,transform .15s}
.plat:active{transform:scale(.99)}
.plat:hover{border-color:var(--ligne)}
.plat .vig{flex:none;width:78px;height:78px;border-radius:12px;overflow:hidden;background:var(--nuit2);display:flex;align-items:center;justify-content:center}
.plat .vig img{width:100%;height:100%;object-fit:cover}
.plat .vig svg{width:42px;height:42px}
.plat .mil{flex:1;min-width:0}
.plat h3{font-size:15.5px;font-weight:700;color:var(--blanc);line-height:1.3}
.plat .d{font-size:13px;color:var(--doux);margin-top:2px;line-height:1.4}
.marques{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.m{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:6px;border:1px solid var(--ligne2);color:var(--doux)}
.m.v{color:#9FE0AE;border-color:rgba(123,216,143,.3)}
.m.sg{color:#F6DE8E;border-color:rgba(246,222,142,.3)}
.m.pm{color:#1A1204;background:var(--or);border-color:transparent}
.m.ep{color:#fff;background:#6B2B2B;border-color:transparent}
.plat .px{flex:none;text-align:right;display:flex;gap:6px;align-items:baseline}
.plat .px b{display:block;width:58px;font-size:15.5px;font-weight:800;color:var(--or2);white-space:nowrap}
.plat .px s{display:block;font-size:12px;color:var(--doux)}
.plat.epuise{opacity:.55}
.plat.epuise .vig img{filter:grayscale(1)}
.coeur{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(7,10,18,.78);display:flex;align-items:center;justify-content:center;z-index:2}
.coeur svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}
.coeur.on svg{fill:var(--orange);stroke:var(--orange)}
.vide{display:none;text-align:center;padding:30px 20px;color:var(--doux)}
.vide.vu{display:block}

/* Semaine */
.semaine{display:grid;gap:8px}
.jour{display:flex;gap:13px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:var(--panneau);border:1px solid var(--ligne2)}
.jour svg{flex:none;width:36px;height:36px;padding:7px;border-radius:10px;background:rgba(246,222,142,.1);color:var(--or2)}
.jour b{display:block;font-size:14.5px}
.jour span{font-size:13px;color:var(--doux)}

/* Bas */
.pied{margin:26px 12px 0;padding:20px 18px 26px;border-radius:var(--r) var(--r) 0 0;background:var(--panneau2);border:1px solid var(--ligne);border-bottom:0;text-align:center}
.pied .infos{font-size:13px;color:var(--doux);line-height:1.6}
.pied .infos b{color:var(--texte)}
.pied .mention{font-size:12px;color:#8892A6;margin-top:12px}
.signature{margin-top:20px;padding-top:18px;border-top:1px solid var(--ligne2);display:flex;flex-direction:column;align-items:center;gap:8px}
.signature img{width:132px;height:auto}
.signature p{font-size:12.5px;color:var(--doux)}
.signature p b{font-family:var(--fc);font-weight:700;letter-spacing:.08em}
.bpatron{margin-top:8px;font-size:13px;font-weight:700;color:var(--or2);border:1px solid var(--ligne);border-radius:99px;padding:9px 16px;display:inline-flex;gap:8px;align-items:center}
.bpatron svg{width:15px;height:15px}

/* Ma sélection */
.barre-sel{position:fixed;left:50%;bottom:14px;transform:translate(-50%,140%);z-index:40;width:min(528px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;background:rgba(9,12,21,.97);border:1px solid rgba(246,222,142,.4);box-shadow:0 14px 40px rgba(0,0,0,.55);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.barre-sel.vue{transform:translate(-50%,0)}
body.a-sel .page{padding-bottom:86px}
.barre-sel .t{flex:1;font-size:14px}
.barre-sel .t b{color:var(--or2)}
.barre-sel button{height:42px;padding:0 16px;border-radius:12px;font-weight:800;font-size:14px;background:var(--or);color:#1A1204}

/* Fenêtres */
.voile{position:fixed;inset:0;z-index:50;background:rgba(3,5,10,.72);opacity:0;pointer-events:none;transition:opacity .25s}
.voile.vu{opacity:1;pointer-events:auto}
.feuille{position:fixed;left:50%;bottom:0;z-index:60;width:min(560px,100%);max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:#0B0F1A;border:1px solid var(--ligne);border-bottom:0;border-radius:24px 24px 0 0;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.feuille.vue{transform:translate(-50%,0)}
.feuille .poignee{position:sticky;top:0;z-index:3;display:flex;justify-content:center;padding:8px 0 0;height:0}
.feuille .poignee i{width:42px;height:5px;border-radius:99px;background:rgba(255,255,255,.35)}
.fermer{position:absolute;top:12px;right:12px;z-index:4;width:38px;height:38px;border-radius:50%;background:rgba(7,10,18,.8);border:1px solid var(--ligne2);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.fiche .ph{aspect-ratio:16/10;position:relative;overflow:hidden;border-radius:24px 24px 0 0;background:var(--nuit2)}
.fiche .ph img{width:100%;height:100%;object-fit:cover}
.fiche .ph::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(180deg,transparent,#0B0F1A)}
.fiche .ph.sansphoto{aspect-ratio:auto;height:150px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 60%,rgba(246,222,142,.12),transparent 60%),var(--nuit2)}
.fiche .ph.sansphoto svg{width:90px;height:90px}
.fiche .co{padding:6px 20px 26px}
.fiche h2{font:600 25px/1.2 var(--fc);letter-spacing:.02em}
.fiche .d{color:var(--doux);margin-top:4px}
.fiche .prix{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.fiche .prix div{flex:1;min-width:120px;padding:11px 14px;border-radius:14px;background:rgba(246,222,142,.07);border:1px solid var(--ligne)}
.fiche .prix small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--doux)}
.fiche .prix b{font-size:22px;font-weight:800;color:var(--or2)}
.fiche .prix s{color:var(--doux);margin-right:6px;font-size:15px}
.fiche h4{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--or2);margin:20px 0 7px}
.fiche .txt{font-size:15px;color:#DDE2EB;line-height:1.6}
.alls{display:flex;flex-wrap:wrap;gap:7px}
.alls span{padding:6px 11px;border-radius:99px;background:rgba(240,138,126,.1);border:1px solid rgba(240,138,126,.3);font-size:13px;font-weight:600;color:#F7C1BA}
.alls.aucun span{background:rgba(123,216,143,.08);border-color:rgba(123,216,143,.3);color:#B8ECC3}
.accord{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 13px;border-radius:14px;border:1px solid var(--ligne);background:rgba(255,255,255,.03)}
.accord .vig{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:var(--nuit2)}
.accord .vig img{width:100%;height:100%;object-fit:cover}
.accord .vig svg{width:32px;height:32px}
.accord b{display:block;font-size:14.5px}
.accord span{font-size:12.5px;color:var(--doux)}
.accord i{margin-left:auto;font-style:normal;color:var(--or2);font-size:20px}
.alerte{margin-top:14px;padding:11px 14px;border-radius:12px;background:rgba(107,43,43,.35);border:1px solid rgba(240,138,126,.35);color:#F7C1BA;font-size:14px;font-weight:600}
.fiche .actions{margin-top:20px;display:flex;gap:10px}
.fiche .actions .btn{flex:1}
.note{font-size:12px;color:#7F889B;margin-top:14px}

/* Sélection */
.sel .co{padding:22px 18px 24px}
.sel h2{font:600 23px/1.2 var(--fc)}
.sel .sous{font-size:13.5px;color:var(--doux);margin-top:4px}
.ligne-sel{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ligne2)}
.ligne-sel .n{flex:1;font-weight:600;font-size:14.5px}
.ligne-sel .n small{display:block;color:var(--doux);font-weight:500;font-size:12.5px}
.qte{display:flex;align-items:center;gap:4px}
.qte button{width:32px;height:32px;border-radius:10px;border:1px solid var(--ligne2);font-size:18px;font-weight:700}
.qte b{min-width:22px;text-align:center}
.ligne-sel .p{width:72px;text-align:right;font-weight:800;color:var(--or2)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;font-size:16px}
.total b{font-size:24px;font-weight:800;color:var(--or2)}

/* Patron */
.patron{position:fixed;inset:0;z-index:80;background:#080B14;overflow-y:auto;display:none}
.patron.vu{display:block}
.pat-haut{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(8,11,20,.97);border-bottom:1px solid var(--ligne)}
.pat-haut img{width:34px}
.pat-haut h2{flex:1;font:600 17px/1.2 var(--fc)}
.pat-haut h2 small{display:block;font:500 12px var(--ff);color:var(--doux)}
.pat-haut button{width:40px;height:40px;border-radius:12px;border:1px solid var(--ligne2);font-size:20px}
.pat-in{max-width:560px;margin:0 auto;padding:16px 14px 60px}
.verrou{text-align:center;padding:26px 10px}
.verrou h3{font:600 22px var(--fc)}
.verrou p{color:var(--doux);font-size:14px;margin-top:6px}
.code{display:flex;justify-content:center;gap:12px;margin:22px 0}
.code i{width:15px;height:15px;border-radius:50%;border:2px solid var(--or3)}
.code i.p{background:var(--or2)}
.code.faux{animation:tremble .35s}
@keyframes tremble{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pave{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pave button{height:62px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--ligne2);font-size:23px;font-weight:700}
.pave button:active{background:rgba(246,222,142,.18)}
