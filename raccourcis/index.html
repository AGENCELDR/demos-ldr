.bgs{position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,9,18,.2),rgba(6,9,18,.65))}
.big{position:fixed;right:-70px;top:30px;width:min(330px,80vw);opacity:.5;-webkit-mask:radial-gradient(closest-side,#000 50%,transparent);mask:radial-gradient(closest-side,#000 50%,transparent);pointer-events:none}
main{position:relative;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 34px) 20px 170px}
.dt{font-size:14px;color:#dfe3ee}.dt:first-letter{text-transform:uppercase}
.clock{font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:1}
.br{display:flex;align-items:center;gap:10px;margin:8px 0 24px;font:400 28px "Bebas Neue",Impact;letter-spacing:.05em}
.br i{height:3px;width:50px;border-radius:3px;background:linear-gradient(90deg,#38BDF8,#F59E0B,#22C55E,#EC4899)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.a{display:block;text-align:center;font:600 11.5px/1.15 "Plus Jakarta Sans";color:#fff;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.ic{display:block;width:min(19vw,76px);aspect-ratio:1;margin:0 auto 6px;border-radius:23%;overflow:hidden;position:relative;box-shadow:0 8px 20px -6px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.12) inset;background:#0d1220;transition:transform .15s}
.a:active .ic{transform:scale(.9)}
.ic>img{width:100%;height:100%;object-fit:cover;display:block}
.ic::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none}
.ic.f{display:grid;grid-template-columns:1fr 1fr;gap:4%;padding:8%;background:rgba(255,255,255,.16);backdrop-filter:blur(12px)}
.m{display:block;border-radius:22%;overflow:hidden;background:#0d1220;position:relative}.m img{width:100%;height:100%;object-fit:cover;display:block}
.ty{display:grid;place-items:center;width:100%;height:100%;text-align:center;font:800 10px/1 "Plus Jakarta Sans"}
.ic>.ty{font-size:clamp(10px,3.3vw,13px)}.m .ty{font-size:5px}.m small{display:none}
.brq{background:#7a2e1c;font-family:Georgia,serif}.fle{background:#4a3a24;font-family:Georgia,serif}.sec{background:#12202e;font-family:Georgia,serif}.amb{background:#1c1c24;font-family:Georgia,serif}
.cal{background:linear-gradient(145deg,#0c3b52,#0a1a2e);font:italic 700 17px/1 Georgia,serif}.cal small{display:block;font:600 7px "Plus Jakarta Sans";letter-spacing:.2em;font-style:normal;color:#7fd8f5;margin-top:3px}
.ig{background:linear-gradient(145deg,#8a5a2b,#3a2412);font:italic 700 12px/1.05 Georgia,serif}
.ami{background:#B5472B;font:italic 800 14px/.95 "Plus Jakarta Sans";letter-spacing:-.04em;color:#EEEBE4}
.pc{background:linear-gradient(145deg,#1a2540,#0a0f1e);font-size:18px}
.sub{display:block;font-size:10px;font-weight:500;color:#9aa3b8;margin-top:2px}.off{opacity:.55}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),500px);padding:12px 10px 8px;border-radius:30px;background:rgba(20,26,44,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 0 0 1px rgba(255,255,255,.1) inset;display:grid;grid-template-columns:repeat(4,1fr)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,5,12,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.ov.on{display:flex}
.box{width:min(calc(100% - 28px),380px);padding:20px 14px 18px;border-radius:32px;background:rgba(26,31,50,.85);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 30px 70px -10px #000;animation:u .25s ease}@keyframes u{from{transform:translateY(30px);opacity:0}}
